name: Ericka public app audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ericka-health/**'
      - '.github/workflows/ericka-public-audit.yml'
permissions:
  contents: read
jobs:
  public-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare isolated browser tools
        run: |
          mkdir -p "$RUNNER_TEMP/ericka-public-audit"
          cd "$RUNNER_TEMP/ericka-public-audit"
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify HTTPS, exact assets, interactions and saved records
        env:
          APP_URL: https://dreamgetterz.github.io/ericka-health/
        run: |
          cd "$RUNNER_TEMP/ericka-public-audit"
          mkdir -p report
          cat > audit.cjs <<'JS'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const url=process.env.APP_URL;
          const results=[];
          const check=(name,condition)=>{assert.ok(condition,name);results.push({name,pass:true});console.log('PASS: '+name);};
          const blobSHA=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const assets={'index.html':'fb93875e37f27b1e4a270bb04e83869b2b168b1b','styles.css':'91d0e2ed407ee0d4ac12c0f8cd065974fcba2d4a','core.js':'16197d9b9c7b3f5cc36d334a6d580205e3370896','app.js':'2107642a3fcf3409b1cd080dd48d8261772e36e3'};
          (async()=>{
            for(const [name,expected] of Object.entries(assets)){
              let response,body;
              for(let attempt=0;attempt<15;attempt++){
                response=await fetch(url+name+'?audit='+Date.now(),{signal:AbortSignal.timeout(20000)});
                body=Buffer.from(await response.arrayBuffer());
                if(response.ok && blobSHA(body)===expected)break;
                await new Promise(r=>setTimeout(r,10000));
              }
              check('Public HTTPS 200 without login: '+name,response.status===200);
              check('Deployed bytes match audited source: '+name,blobSHA(body)===expected);
            }
            const profile=process.env.RUNNER_TEMP+'/ericka-audit-browser-profile';
            const options={headless:true,viewport:{width:390,height:844},timezoneId:'America/Los_Angeles'};
            let context=await chromium.launchPersistentContext(profile,options);
            let page=context.pages()[0]||await context.newPage();
            const errors=[];
            const initialize=async()=>{
              page.on('pageerror',e=>errors.push(e.message));
              page.on('dialog',d=>d.accept());
              await page.clock.setFixedTime(new Date('2026-09-19T19:00:00Z'));
              await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              await page.waitForFunction(()=>window.ErickaApp?.version==='2.0.0');
              page.setDefaultTimeout(5000);
            };
            await initialize();
            check('Public page initializes actual JavaScript',await page.evaluate(()=>ErickaApp.version==='2.0.0'));
            check('Starting weight and date accurate',await page.evaluate(()=>ErickaApp.getState().profile.startWeight===155&&ErickaApp.getState().profile.startDate==='2026-09-10'));
            check('Latest weight 147 and loss 8 lb',await page.evaluate(()=>ErickaApp.getMetrics().current===147&&ErickaApp.getMetrics().lost===8));
            check('Goal 130 by January 31, 2027',await page.evaluate(()=>ErickaApp.getState().profile.goalWeight===130&&ErickaApp.getMetrics().deadline==='2027-01-31'));
            check('Remaining 17 lb and progress 32 percent',await page.evaluate(()=>ErickaApp.getMetrics().remain===17&&ErickaApp.getMetrics().pct===32));
            check('143 calendar day plan and 134 days remaining',await page.evaluate(()=>ErickaApp.getState().profile.targetDays===143&&ErickaApp.getMetrics().remainingDays===134));
            check('Native browser localStorage successfully initialized',await page.evaluate(()=>JSON.parse(localStorage.getItem('jedi-ericka-health-v1')).owner==='ericka'));
            check('No inherited or invented medication schedule',await page.evaluate(()=>ErickaApp.getState().medications.length===0));
            check('No projection from only two early weigh-ins',await page.evaluate(()=>ErickaApp.getMetrics().projected===null));
            check('Peptide knowledge and Featured Insight retained',await page.evaluate(()=>ErickaApp.getKnowledge().length===13&&ErickaApp.featured('2026-09-19').title==='Tirzepatide'));
            check('No butterflies or photo images',await page.locator('img').count()===0);
            for(const width of [320,375,390,430,768,1440]){
              await page.setViewportSize({width,height:900});
              for(const screen of ['home','food','progress','more','learn']){
                await page.evaluate(s=>ErickaApp.show(s),screen);
                await page.waitForTimeout(80);
                check(screen+' fits '+width+'px',await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));
              }
            }
            await page.setViewportSize({width:390,height:844});
            await page.evaluate(()=>ErickaApp.show('home'));
            await page.screenshot({path:'report/home-public.png',fullPage:true});
            await page.evaluate(()=>ErickaApp.show('progress'));
            await page.waitForTimeout(100);
            check('Four plotted goal and actual/reference lines',await page.locator('#comparisonChart path').count()===4);
            await page.screenshot({path:'report/progress-public.png',fullPage:true});
            await page.evaluate(()=>ErickaApp.show('food'));
            await page.locator('#food [data-open="food"]').click();
            await page.fill('#foodName','TEST FOOD - audit only');
            await page.fill('#servingInput','1 serving');
            await page.fill('#quantityInput','1.5');
            await page.fill('#caloriesInput','200');
            await page.fill('#proteinInput','20');
            await page.locator('#foodForm button[type=submit]').click();
            check('Real form saves serving-adjusted calories',await page.evaluate(()=>ErickaApp.getTotals('2026-09-19').calories.value===300));
            check('Real form saves serving-adjusted protein',await page.evaluate(()=>ErickaApp.getTotals('2026-09-19').protein.value===30));
            check('Unknown carbohydrate not fabricated as complete zero',await page.evaluate(()=>ErickaApp.getTotals('2026-09-19').carbs.missing===1));
            await page.reload({waitUntil:'networkidle'});
            check('Food survives public-page reload',await page.evaluate(()=>ErickaApp.getState().foods.length===1));
            await context.close();
            context=await chromium.launchPersistentContext(profile,options);
            page=context.pages()[0]||await context.newPage();
            await initialize();
            check('Food survives browser close and reopening with native storage',await page.evaluate(()=>ErickaApp.getState().foods.length===1&&ErickaApp.getTotals('2026-09-19').calories.value===300));
            await page.evaluate(()=>ErickaApp.show('food'));
            await page.locator('[data-food-edit]').first().click();
            await page.fill('#quantityInput','2');
            await page.locator('#foodForm button[type=submit]').click();
            check('Food correction updates rather than duplicates',await page.evaluate(()=>ErickaApp.getState().foods.length===1&&ErickaApp.getTotals('2026-09-19').calories.value===400));
            await page.locator('[data-food-delete]').first().click();
            check('Removal updates diary total',await page.evaluate(()=>ErickaApp.getState().foods.length===0));
            await page.locator('#undoBtn').click();
            check('Undo restores record and total',await page.evaluate(()=>ErickaApp.getState().foods.length===1&&ErickaApp.getTotals('2026-09-19').calories.value===400));
            await page.screenshot({path:'report/food-public-test-data.png',fullPage:true});
            await page.evaluate(()=>ErickaApp.show('home'));
            await page.fill('#question','What is MOTS-C?');
            check('AI summary sharing is off by default',!(await page.locator('#shareSummary').isChecked()));
            await page.locator('#liveAI').click();
            await page.waitForFunction(()=>document.getElementById('aiStatus').textContent.includes('not connected'),null,{timeout:35000});
            check('Missing live AI is reported honestly, not simulated as a model answer',(await page.locator('#aiStatus').innerText()).includes('not connected'));
            check('AI unavailable state does not change weight',await page.evaluate(()=>ErickaApp.getMetrics().current===147));
            check('No uncaught JavaScript errors in public browser tests',errors.length===0);
            await context.close();
            fs.writeFileSync('report/results.json',JSON.stringify({url,checkedAt:new Date().toISOString(),scope:'Actual public HTTPS and native Chromium localStorage. Synthetic food entries confined to isolated test profile. Live AI unavailable.',passed:results.length,results},null,2));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Ericka public-app audit\n\n'+results.length+' checks passed against '+url+'\n\nNative browser storage survived both reload and browser restart. No personal records were changed: test data stayed in the isolated CI browser.\n\n**Open item: live AI service not connected.** Source-based local answers and the peptide library work.\n');
          })().catch(e=>{fs.writeFileSync('report/failure.txt',e.stack||String(e));console.error(e);process.exit(1);});
          JS
          node audit.cjs
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ericka-public-audit
          path: ${{ runner.temp }}/ericka-public-audit/report/
          retention-days: 14
