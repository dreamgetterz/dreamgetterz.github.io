<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RetellAI — Xfers & Appts Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg0:#f8f9fc;--bg1:#eef0f6;--bg2:#ffffff;--bg3:#f0f2f8;--bg4:#e4e7f0;
  --b0:#d0d4e0;--b1:#bcc1d4;
  --t0:#1a1d2e;--t1:#3a3f55;--t2:#6b7090;--t3:#8b90a8;
  --grn:#00e59b;--grn-d:rgba(0,229,155,.18);
  --blu:#4d8eff;--blu-d:rgba(77,142,255,.18);
  --amb:#ffb443;--amb-d:rgba(255,180,67,.18);
  --red:#ff4d6a;--red-d:rgba(255,77,106,.18);
  --pur:#a78bfa;--pur-d:rgba(167,139,250,.18);
  --cyn:#22d3ee;--cyn-d:rgba(34,211,238,.18);
  --f:'Space Grotesk',sans-serif;--m:'JetBrains Mono',monospace;
  --r:10px;--rs:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg0);color:var(--t0);font-family:var(--f);-webkit-font-smoothing:antialiased;font-size:14px}
.D{min-height:100vh;padding:20px 24px;max-width:1480px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--b0)}
.hdr-l{display:flex;align-items:center;gap:14px}
.logo{width:38px;height:38px;background:linear-gradient(135deg,var(--grn),var(--cyn));border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--m);font-weight:700;font-size:13px;color:var(--bg0)}
.hdr h1{font-size:28px;font-weight:600;letter-spacing:-.5px}
.hdr h1 span{color:var(--t2);font-weight:400;font-size:15px;margin-left:8px}
.hdr-r{display:flex;align-items:center;gap:10px}
.dbg{font-family:var(--m);font-size:11px;color:var(--t1);background:var(--bg3);padding:7px 12px;border-radius:var(--rs);border:1px solid var(--b0)}
.api-st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;padding:7px 12px;border-radius:var(--rs)}
.api-live{background:var(--grn-d);color:var(--grn)}.api-demo{background:var(--amb-d);color:var(--amb)}.api-load{background:var(--blu-d);color:var(--blu)}.api-err{background:var(--red-d);color:var(--red)}
.api-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.api-live .api-dot{background:var(--grn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.nav{display:flex;align-items:center;gap:3px;background:var(--bg1);padding:3px;border-radius:var(--r);margin-bottom:20px;overflow-x:auto;width:fit-content;max-width:100%}
.ntab{padding:10px 18px;border-radius:var(--rs);font-size:16px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .2s;border:none;background:0;font-family:var(--f);white-space:nowrap}
.ntab:hover{color:var(--t1)}.ntab.on{background:var(--bg2);color:var(--t0);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ntab.sum{font-weight:600;border-right:1px solid var(--b0);margin-right:4px;padding-right:20px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px}

.ccard{background:var(--bg2);border-radius:var(--r);padding:18px;margin-bottom:14px;cursor:pointer;transition:box-shadow .15s;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ccard:hover{box-shadow:0 2px 6px rgba(0,0,0,.12)}
.cc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.cc-name{font-size:26px;font-weight:700;letter-spacing:-.3px}
.cc-meta{display:flex;align-items:center;gap:8px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;padding:3px 9px;border-radius:16px}
.st-d{width:5px;height:5px;border-radius:50%;display:inline-block}
.st-a{background:var(--grn-d);color:var(--grn)}.st-a .st-d{background:var(--grn)}
.st-l{background:var(--amb-d);color:var(--amb)}.st-l .st-d{background:var(--amb)}
.cc-right{display:flex;align-items:center;gap:12px}

.cb{width:100%;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.cf{height:100%;border-radius:3px;transition:width .5s ease}

.metrics{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:14px}
.met{background:var(--bg3);border-radius:var(--rs);padding:10px}
.met-l{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;font-weight:600}
.met-v{font-family:var(--m);font-size:26px;font-weight:600;letter-spacing:-.3px}

.bot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bot-sec{background:var(--bg3);border-radius:var(--rs);padding:12px}
.bot-title{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:8px}

.wgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;text-align:center}
.wgrid .wlbl{font-size:8px;color:var(--t3);margin-bottom:4px}
.wgrid .wval{font-family:var(--m);font-size:16px;font-weight:600}
.wgrid .wsub{font-size:7px;color:var(--t3);margin:2px 0}

/* Mini bar chart - pure CSS */
.bars{display:flex;align-items:flex-end;gap:3px;height:100px;padding-top:4px}
.bar-group{display:flex;flex-direction:column;align-items:center;flex:1;height:100%;justify-content:flex-end}
.bar-pair{display:flex;gap:2px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.bar-col{width:40%;border-radius:3px 3px 0 0;transition:height .4s ease;min-height:2px;position:relative}
.bar-col:hover{filter:brightness(1.3)}
.bar-col[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--t0);font-family:var(--m);font-size:9px;padding:3px 6px;border-radius:4px;white-space:nowrap;margin-bottom:4px;border:1px solid var(--b1)}
.bar-lbl{font-size:9px;color:var(--t3);margin-top:4px;text-align:center}
.bar-chg{display:flex;gap:8px;align-items:center}
.tag{font-family:var(--m);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.tg{background:var(--grn-d);color:var(--grn)}.tr{background:var(--red-d);color:var(--red)}

/* Toggle buttons */
.toggle-group{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.toggle-btn{padding:8px 14px;border-radius:var(--rs);font-size:14px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .2s;border:none;background:var(--bg1);font-family:var(--f)}
.toggle-btn:hover{color:var(--t1)}.toggle-btn.active{background:var(--bg2);color:var(--t0);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* Detail page */
.dtl-back{font-size:12px;color:var(--t2);cursor:pointer;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.dtl-back:hover{color:var(--t0)}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.hc{background:var(--bg2);border-radius:var(--r);padding:18px 16px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hc .bar-top{position:absolute;top:0;left:0;right:0;height:3px}
.hc-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);margin-bottom:6px}
.hc-v{font-family:var(--m);font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1}
.hc-s{font-size:12px;color:var(--t1);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.kp{background:var(--bg2);border-radius:var(--r);padding:14px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kp-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);margin-bottom:4px}
.kp-v{font-family:var(--m);font-size:28px;font-weight:600;letter-spacing:-.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.cd{background:var(--bg2);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cd-t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t2);margin-bottom:12px}

/* Funnel */
.funnel-row{margin-bottom:12px}
.funnel-hdr{display:flex;justify-content:space-between;margin-bottom:4px}
.funnel-lbl{font-size:11px;color:var(--t1)}
.funnel-val{font-family:var(--m);font-size:13px;font-weight:600}
.funnel-bg{width:100%;height:24px;background:var(--bg4);border-radius:4px;overflow:hidden}
.funnel-fill{height:100%;border-radius:4px;transition:width .5s}
.funnel-sub{font-size:9px;color:var(--t3);font-family:var(--m);margin-top:2px}

/* Credit modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.mdl{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:24px;width:400px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.mdl h3{font-size:15px;font-weight:600;margin-bottom:3px}
.mdl p{font-size:11px;color:var(--t3);margin-bottom:16px}
.mdl label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--t2);display:block;margin-bottom:5px}
.mdl input{width:100%;padding:9px 11px;background:var(--bg3);border:1px solid var(--b0);border-radius:var(--rs);color:var(--t0);font-family:var(--m);font-size:13px;margin-bottom:14px;outline:none}
.mdl input:focus{border-color:var(--blu)}
.mda{display:flex;gap:8px;justify-content:flex-end}
.btn-p{background:var(--grn);color:var(--bg0);padding:8px 16px;border-radius:var(--rs);font-family:var(--f);font-size:12px;font-weight:500;cursor:pointer;border:none}
.btn-g{background:0;border:1px solid var(--b1);color:var(--t1);padding:8px 16px;border-radius:var(--rs);font-family:var(--f);font-size:12px;cursor:pointer}
.btn-c{background:var(--blu-d);color:var(--blu);border:1px solid transparent;padding:4px 10px;border-radius:var(--rs);font-family:var(--f);font-size:10px;font-weight:500;cursor:pointer}
.btn-c:hover{border-color:var(--blu)}
.mo{font-family:var(--m)}

.preview-box{background:var(--bg3);border-radius:var(--rs);padding:10px;margin-bottom:14px}

@media(max-width:1200px){.metrics{grid-template-columns:repeat(4,1fr)}.hero{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){.metrics{grid-template-columns:repeat(2,1fr)}.hero,.g2,.bot{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.hdr{flex-direction:column;gap:10px;align-items:flex-start}}
</style>
</head>

// ═══════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════
const SAMPLE = [
  { id:1, name:"AMITY", agents:["FULL TAX INBOUND","Tax Short Inbound"], status:"active",
    creditBalance:4200, creditsPurchased:12000, costPerTransfer:15, costPerAppointment:35, monthlyRetainer:1500,

    daily:[{d:"Thu",xfers:1,appts:1},{d:"Fri",xfers:2,appts:2},{d:"Sat",xfers:1,appts:0},{d:"Sun",xfers:0,appts:0},{d:"Mon",xfers:2,appts:2},{d:"Tue",xfers:2,appts:2},{d:"Today",xfers:2,appts:1}],

    todayCalls:6, todayTransfers:1, todayAppointments:1,
    weekCalls:41, weekTransfers:6, weekAppointments:4,
    monthCalls:152, monthTransfers:27, monthAppointments:19,
    daily:[{d:"Thu",xfers:1,appts:1},{d:"Fri",xfers:1,appts:0},{d:"Sat",xfers:0,appts:0},{d:"Sun",xfers:0,appts:0},{d:"Mon",xfers:1,appts:1},{d:"Tue",xfers:2,appts:1},{d:"Today",xfers:1,appts:1}],
    monthly:[{mo:"Nov",xfers:14,appts:10},{mo:"Dec",xfers:19,appts:14},{mo:"Jan",xfers:25,appts:19},{mo:"Feb",xfers:28,appts:22},{mo:"Mar",xfers:32,appts:24},{mo:"Apr",xfers:27,appts:19}],
    weekly:[{wk:"W1",xfers:6,appts:4},{wk:"W2",xfers:7,appts:5},{wk:"W3",xfers:8,appts:6},{wk:"W4",xfers:7,appts:5},{wk:"W5",xfers:9,appts:7},{wk:"W6",xfers:8,appts:6},{wk:"W7",xfers:7,appts:5},{wk:"W8",xfers:6,appts:4}],

// ═══════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════
const fmt = n => n?.toLocaleString() ?? "—";
const fmtC = n => "$" + (n??0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtP = n => ((n??0)*100).toFixed(1) + "%";
const CLR = ["#00e59b","#4d8eff","#a78bfa","#ffb443","#ff4d6a","#22d3ee"];
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "className") el.className = v;
    else if (k === "innerHTML") el.innerHTML = v;
    else el.setAttribute(k, v);
  });
  kids.flat(9).forEach(c => { if (c != null) el.append(typeof c === "string" ? c : c); });
  return el;
};

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let clients = SAMPLE;
let currentTab = "summary"; // "summary" or client id
let chartMode = "daily";    // "daily" or "weekly"
let apiStatus = "loading";

// ═══════════════════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════════════════
async function loadFromAPI() {
  if (!API_KEY) { apiStatus = "demo"; render(); return; }
  try {
    // Try direct first, then CORS proxies for local file:// usage
    const ENDPOINTS = [
      "https://api.retellai.com/v2/list-calls",
    ];

    let res = null;
    for (const url of ENDPOINTS) {
      try {
        res = await fetch(url, {
          method: "POST",
          headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ sort_order: "descending", limit: 1000 }),
        });
        if (res.ok) { console.log("API connected via:", url); break; }
      } catch(_) { console.log("Trying next endpoint..."); res = null; }
    }
    if (!res || !res.ok) throw new Error("All API endpoints failed");

    const calls = await res.json();
    if (Array.isArray(calls) && calls.length > 0) {
      console.log("=== LOADED " + calls.length + " CALLS FROM RETELLAI ===");
      // Discover agents
      const agentMap = {};
      calls.forEach(c => {
        const aid = c.agent_id || "unknown";
        if (!agentMap[aid]) agentMap[aid] = { id:aid, name:aid, calls:[] };
        agentMap[aid].calls.push(c);
      });
      console.log("=== AGENT IDS FOUND (map these to clients in CLIENT_CONFIG) ===");
      Object.values(agentMap).forEach(a => console.log("Agent ID:", a.id, "| Calls:", a.calls.length));

      // Auto-distribute agents across clients
      const agentIds = Object.keys(agentMap);
      const perClient = Math.ceil(agentIds.length / CLIENT_CONFIG.length);

      const dayMs = 24*3600*1000;
      const weekMs = 7*dayMs;
      const now = Date.now();
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
      const isXfer = c => c.disconnection_reason === "call_transfer";
      const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

      clients = CLIENT_CONFIG.map((cfg, i) => {
        const hasMapped = cfg.agentIds.length > 0;
        const myIds = hasMapped ? cfg.agentIds : agentIds.slice(i*perClient, (i+1)*perClient);
        const myCalls = calls.filter(c => myIds.includes(c.agent_id));
        const xfers = myCalls.filter(isXfer).length;
        const appts = xfers; // transfers = appointments for now
        const monthMap = {};

        myCalls.forEach(c => {
          if (!c.start_timestamp) return;
          const d = new Date(c.start_timestamp);
          const mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
          if (!monthMap[mo]) monthMap[mo] = {mo, xfers:0, appts:0, ts:d.getTime()};
          if (isXfer(c)) { monthMap[mo].xfers++; monthMap[mo].appts++; }
        });

        const weekly = Array.from({length:8},(_,wi) => {
          const wStart = now - (8-wi)*weekMs, wEnd = wStart + weekMs;
          const wc = myCalls.filter(c => c.start_timestamp >= wStart && c.start_timestamp < wEnd);
          const wx = wc.filter(isXfer).length;
          return { wk:"W"+(wi+1), xfers:wx, appts:wx };
        });

        const daily = Array.from({length:7},(_,di) => {
          const dStart = todayStart.getTime() - (6-di)*dayMs, dEnd = dStart + dayMs;
          const dc = myCalls.filter(c => c.start_timestamp >= dStart && c.start_timestamp < dEnd);
          const dx = dc.filter(isXfer).length;
          const lbl = di === 6 ? "Today" : DAY_NAMES[new Date(dStart).getDay()];
          return { d:lbl, xfers:dx, appts:dx };
        });

        const todayCalls = myCalls.filter(c => c.start_timestamp >= todayStart.getTime()).length;
        const todayTransfers = myCalls.filter(c => c.start_timestamp >= todayStart.getTime() && isXfer(c)).length;
        const weekCalls = myCalls.filter(c => c.start_timestamp >= now - weekMs).length;
        const weekTransfers = myCalls.filter(c => c.start_timestamp >= now - weekMs && isXfer(c)).length;
        const monthCalls = myCalls.filter(c => c.start_timestamp >= monthStart.getTime()).length;
        const monthTransfers = myCalls.filter(c => c.start_timestamp >= monthStart.getTime() && isXfer(c)).length;

        return {
          ...cfg, agents: myIds.map(id => agentMap[id]?.name || id),
          status: cfg.creditBalance/cfg.creditsPurchased < .15 ? "low_credit" : "active",
          totalCalls: myCalls.length, totalTransfers: xfers, totalAppointments: appts,
          todayCalls, todayTransfers, todayAppointments: todayTransfers,
          weekCalls, weekTransfers, weekAppointments: weekTransfers,
          monthCalls, monthTransfers, monthAppointments: monthTransfers,
          showed: Math.round(appts*.83), noShow: Math.round(appts*.17),
          monthly: Object.values(monthMap).sort((a,b)=>a.ts-b.ts).slice(-6),
          weekly, daily,
        };
      });
      apiStatus = "live";
    } else { apiStatus = "demo"; }
  } catch(e) {
    console.error("API Error:", e);
    apiStatus = "error";
  }
  render();
}

// ═══════════════════════════════════════════════════════════════════════════
// MINI BAR CHART (pure CSS)
// ═══════════════════════════════════════════════════════════════════════════
function miniBarChart(data, key1, key2, color1, color2) {
  const max = Math.max(...data.map(d => Math.max(d[key1]||0, d[key2]||0)), 1);
  const container = h("div", {className:"bars"});
  data.forEach(d => {
    const h1 = Math.max(((d[key1]||0)/max)*100, 3);
    const h2 = Math.max(((d[key2]||0)/max)*100, 3);
    const grp = h("div", {className:"bar-group"},
      h("div", {className:"bar-pair"},
        h("div", {className:"bar-col", "data-tooltip": key1+": "+d[key1], style:{height:h1+"%", background:color1, opacity:"0.7"}}),
        h("div", {className:"bar-col", "data-tooltip": key2+": "+d[key2], style:{height:h2+"%", background:color2}}),
      ),
      h("div", {className:"bar-lbl"}, d.mo || d.wk || d.d || ""),
    );
    container.append(grp);
  });
  return container;
}

    h("div",{style:{display:"flex",gap:"8px",marginBottom:"12px",flexWrap:"wrap"}},
      periodBlock("Today", c.todayCalls, c.todayTransfers, c.todayAppointments, "var(--grn)"),

      h("button",{className:"toggle-btn "+(chartMode==="weekly"?"active":""),onClick:e=>{e.stopPropagation();chartMode="weekly";render();}},"Weekly"),

    ),
  );
  return card;
}

      h("div",{className:"kp"},h("div",{className:"kp-l"},"Call→Xfer"),h("div",{className:"kp-v",style:{color:"var(--cyn)"}},fmtP(xR))),
      h("div",{className:"kp"},h("div",{className:"kp-l"},"Xfer→Appt"),h("div",{className:"kp-v",style:{color:"var(--blu)"}},fmtP(x2a))),
      h("div",{className:"kp"},h("div",{className:"kp-l"},"Actual $/Appt"),h("div",{className:"kp-v mo"},fmtC(costAppt))),
      h("div",{className:"kp"},h("div",{className:"kp-l"},"Rate $/Appt"),h("div",{className:"kp-v mo"},fmtC(c.costPerAppointment))),
    ),
    // Toggle buttons for daily/weekly
    h("div",{className:"toggle-group"},
      h("button",{className:"toggle-btn "+(chartMode==="daily"?"active":""),onClick:()=>{chartMode="daily";render();}},"Daily"),
      h("button",{className:"toggle-btn "+(chartMode==="weekly"?"active":""),onClick:()=>{chartMode="weekly";render();}},"Weekly"),

    h("div",{className:"g2"},
      h("div",{className:"cd"},
        h("div",{className:"cd-t"},chartMode==="daily"?"Last 7 Days (Xfers & Appts)":"Last 8 Weeks (Xfers & Appts)"),
        miniBarChart(chartMode==="daily"?c.daily:c.weekly,"xfers","appts","#a78bfa","#00e59b"),

    ),
  );
  return frag;
}

// ═══════════════════════════════════════════════════════════════════════════
// CREDIT MODAL
// ═══════════════════════════════════════════════════════════════════════════
let creditTarget = null;
function showCreditModal(c) { creditTarget = c; render(); }
function closeCreditModal() { creditTarget = null; render(); }
function addCredit() {
  const input = document.getElementById("credit-input");
  const amt = parseFloat(input?.value);
  if (!amt || !creditTarget) return;
  clients = clients.map(c => c.id===creditTarget.id ? {...c, creditBalance:c.creditBalance+amt, creditsPurchased:c.creditsPurchased+amt} : c);
  closeCreditModal();
}

// ═══════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════════
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const statusClass = apiStatus==="live"?"api-live":apiStatus==="error"?"api-err":apiStatus==="loading"?"api-load":"api-demo";
  const statusText = apiStatus==="live"?"Live Data":apiStatus==="error"?"API Error — Using Sample":apiStatus==="loading"?"Connecting...":"Sample Data";

  // Header
  app.append(
    h("div",{className:"hdr"},
      h("div",{className:"hdr-l"},
        h("div",{className:"logo"},"RA"),
        h("h1",null,"RetellAI",h("span",null,"Xfers & Appts")),
      ),
      h("div",{className:"hdr-r"},
        h("div",{className:"api-st "+statusClass}, h("span",{className:"api-dot"}), " "+statusText),
        h("div",{className:"dbg"}, new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"})),
      ),
    ),
  );

  // Tabs
  const nav = h("div",{className:"nav"},
    h("button",{className:"ntab sum "+(currentTab==="summary"?"on":""),onClick:()=>{currentTab="summary";render();}},"All Clients"),
  );
  clients.forEach(c => {
    nav.append(h("button",{className:"ntab "+(currentTab===c.id?"on":""),onClick:()=>{currentTab=c.id;render();}},
      h("span",{className:"dot",style:{background:c.status==="low_credit"?"var(--amb)":"var(--grn)"}}), c.name
    ));
  });
  app.append(nav);

  // Content
  if (currentTab === "summary") {
    clients.forEach((c,i) => app.append(renderClientCard(c, i)));
  } else {
    const c = clients.find(x => x.id === currentTab);
    if (c) app.append(renderDetailPage(c));
  }

  // Credit modal
  if (creditTarget) {
    const overlay = h("div",{className:"mbg",onClick:closeCreditModal},
      h("div",{className:"mdl",onClick:e=>e.stopPropagation()},
        h("h3",null,"Add Credits"),
        h("p",null,creditTarget.name+" | Balance: "+fmtC(creditTarget.creditBalance)+" | "+fmtC(creditTarget.costPerAppointment)+"/appt"),
        h("label",null,"Credit Amount ($)"),
        h("input",{type:"number",placeholder:"1000.00",id:"credit-input",autofocus:"true"}),
        h("div",{className:"mda"},
          h("button",{className:"btn-g",onClick:closeCreditModal},"Cancel"),
          h("button",{className:"btn-p",onClick:addCredit},"Add Credits"),
        ),
      ),
    );
    app.append(overlay);
  }
}
